services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.1
    restart: unless-stopped
    shm_size: "256mb"
    environment:
      - TZ=${TZ:-UTC}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - "${FRIGATE_STORAGE_PATH:-./storage}:/media/frigate"
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    depends_on:
      - mosquitto

  mosquitto:
    container_name: mosquitto
    image: "${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}"
    restart: unless-stopped
    volumes:
      - ./mosquitto:/mosquitto/config
    # No host port: Frigate reaches MQTT over the compose network only
