<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Display</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: auto;
    }

    #media {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    #stage.zoomed #media {
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: initial;
    }

    #zoom {
      position: fixed;
      z-index: 1;
      top: 0.75rem;
      right: 0.75rem;
      padding: 0.5rem 0.75rem;
    }

    #status {
      position: fixed;
      inset: auto 0 0;
      padding: 0.5rem;
      color: #fff;
      background: rgb(0 0 0 / 70%);
      font: 14px sans-serif;
      text-align: center;
    }

    #status:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <button id="zoom" type="button" aria-pressed="false" hidden>Zoom to actual size</button>
  <div id="status" role="status"></div>

  <script>
    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    const zoom = document.getElementById('zoom');
    let activeName = '';
    let activeMedia;

    const imageTypes = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp', 'avif', 'bmp']);
    const videoTypes = new Set(['mp4', 'webm', 'ogv']);

    function setZoom(enabled) {
      stage.classList.toggle('zoomed', enabled);
      zoom.setAttribute('aria-pressed', String(enabled));
      zoom.textContent = enabled ? 'Fit to screen' : 'Zoom to actual size';
      if (!enabled) {
        stage.scrollTo(0, 0);
      }
    }

    zoom.addEventListener('click', () => {
      setZoom(!stage.classList.contains('zoomed'));
    });

    function isSupported(name) {
      const extension = name.split('.').pop().toLowerCase();
      return imageTypes.has(extension) || videoTypes.has(extension);
    }

    function showMedia(name) {
      const extension = name.split('.').pop().toLowerCase();
      const isImage = imageTypes.has(extension);
      const isVideo = videoTypes.has(extension);

      if (!isImage && !isVideo) {
        status.textContent = `Unsupported media type: ${extension || 'unknown'}`;
        return;
      }

      const media = document.createElement(isImage ? 'img' : 'video');
      media.id = 'media';
      media.src = `${encodeURIComponent(name)}?t=${Date.now()}`;
      setZoom(false);
      zoom.hidden = true;

      if (isVideo) {
        media.autoplay = true;
        media.controls = true;
        media.loop = true;
        media.muted = true;
        media.playsInline = true;
      }

      media.addEventListener('error', () => {
        status.textContent = `Unable to display ${name}. Check that the file exists and is supported.`;
      });
      media.addEventListener('load', () => {
        status.textContent = '';
        if (isImage) {
          zoom.hidden = false;
        }
      });
      media.addEventListener('loadeddata', () => {
        status.textContent = '';
      });

      stage.replaceChildren(media);
      activeMedia = media;
      activeName = name;
      status.textContent = '';
    }

    async function refresh() {
      try {
        const response = await fetch(`current.txt?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) {
          if (!activeName) {
            showMedia('current.jpg');
            return;
          }
          if (activeName === 'current.jpg') {
            return;
          }
          throw new Error(`Manifest request failed (${response.status})`);
        }

        const name = (await response.text()).trim();
        if (!name || /[\\/]/.test(name) || name === '.' || name === '..') {
          throw new Error('current.txt must contain a media filename in this folder');
        }
        if (!isSupported(name)) {
          throw new Error('current.txt must name a supported image or video file');
        }

        if (name !== activeName) {
          showMedia(name);
        }
      } catch (error) {
        if (!activeMedia && !activeName) {
          showMedia('current.jpg');
          return;
        }
        if (activeName !== 'current.jpg') {
          status.textContent = error.message || 'Unable to check for new media.';
        }
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
