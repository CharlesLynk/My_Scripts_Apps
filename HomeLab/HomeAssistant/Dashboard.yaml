views:
  - title: Home
    path: home
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: markdown
            content: "## Hello {{ user }}"
            text_only: true
          - show_state: false
            show_name: false
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: camera.outside_reolink_fluent
            camera_image: camera.outside_reolink_fluent
            grid_options:
              columns: 12
              rows: 4
      - type: grid
        cards:
          - type: heading
            heading: Room Controls
            heading_style: title
            icon: mdi:home
          - type: custom:simple-swipe-card
            show_pagination: true
            card_spacing: 12
            cards:
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Living Room
                    heading_style: subtitle
                    icon: mdi:sofa
                  - type: tile
                    entity: light.living_room_lights
                    name: Living Room Lights
                    icon: mdi:lightbulb-group
                    tap_action:
                      action: more-info
                    hold_action:
                      action: navigate
                      navigation_path: /home/areas-living_room
                    features_position: bottom
                    features:
                      - type: light-brightness
                      - type: light-color-temp
                  - type: grid
                    columns: 3
                    square: true
                    cards:
                      - type: button
                        name: Soundbar Remote
                        icon: mdi:soundbar
                        tap_action:
                          action: fire-dom-event
                          browser_mod:
                            service: browser_mod.popup
                            data:
                              title: Living Room Soundbar Remote
                              content:
                                type: vertical-stack
                                cards:
                                  - type: grid
                                    columns: 2
                                    square: true
                                    cards:
                                      - type: button
                                        name: Power
                                        icon: mdi:power
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_soundbar_power
                                      - type: button
                                        name: Mute
                                        icon: mdi:volume-mute
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_soundbar_mute
                                      - type: button
                                        name: Vol Down
                                        icon: mdi:volume-minus
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_soundbar_volume_down
                                      - type: button
                                        name: Vol Up
                                        icon: mdi:volume-plus
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_soundbar_volume_up
                                  - type: custom:nonlinear-timer-slider-card
                                    entity: >-
                                      input_number.livingroom_soundbar_mute_timer_seconds
                                    name: Mute Timer (seconds)
                                    icon: mdi:timer-sand
                      - type: button
                        name: TV Remote
                        icon: mdi:remote-tv
                        tap_action:
                          action: fire-dom-event
                          browser_mod:
                            service: browser_mod.popup
                            data:
                              title: Living Room TV Remote
                              content:
                                type: vertical-stack
                                cards:
                                  - type: grid
                                    columns: 4
                                    square: true
                                    cards:
                                      - type: button
                                        name: Power
                                        icon: mdi:power
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_power
                                      - type: button
                                        name: HDMI1
                                        icon: mdi:video-input-hdmi
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_hdmi_1
                                      - type: button
                                        name: HDMI2
                                        icon: mdi:video-input-hdmi
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_hdmi_2
                                      - type: button
                                        name: Input
                                        icon: mdi:video-input-component
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_input
                                  - type: grid
                                    columns: 3
                                    square: false
                                    cards:
                                      - type: button
                                        name: Return
                                        icon: mdi:keyboard-return
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_return
                                      - type: button
                                        name: Up
                                        icon: mdi:chevron-up
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_up
                                      - type: button
                                        name: Exit
                                        icon: mdi:exit-to-app
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_exit
                                      - type: button
                                        name: Left
                                        icon: mdi:chevron-left
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_left
                                      - type: button
                                        name: Enter
                                        icon: mdi:check-circle-outline
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_enter
                                      - type: button
                                        name: Right
                                        icon: mdi:chevron-right
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_right
                                      - type: button
                                        name: ""
                                        show_name: false
                                        show_icon: false
                                        tap_action:
                                          action: none
                                      - type: button
                                        name: Down
                                        icon: mdi:chevron-down
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_down
                                      - type: button
                                        name: ""
                                        show_name: false
                                        show_icon: false
                                        tap_action:
                                          action: none
                                      - type: button
                                        name: Mute
                                        icon: mdi:volume-mute
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_mute
                                      - type: button
                                        name: Vol Down
                                        icon: mdi:volume-minus
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_volume_down
                                      - type: button
                                        name: Vol Up
                                        icon: mdi:volume-plus
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_tv_volume_up
                      - type: button
                        name: Fire TV Remote
                        icon: mdi:fire
                        tap_action:
                          action: fire-dom-event
                          browser_mod:
                            service: browser_mod.popup
                            data:
                              title: Living Room Fire TV Remote
                              content:
                                type: vertical-stack
                                cards:
                                  - type: grid
                                    columns: 4
                                    square: true
                                    cards:
                                      - type: button
                                        name: Power
                                        icon: mdi:power
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: POWER
                                      - type: button
                                        name: Home
                                        icon: mdi:home
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: HOME
                                      - type: button
                                        name: Menu
                                        icon: mdi:menu
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: MENU
                                      - type: button
                                        name: Settings
                                        icon: mdi:cog
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: SETTINGS
                                  - type: grid
                                    columns: 3
                                    square: false
                                    cards:
                                      - type: button
                                        name: Return
                                        icon: mdi:keyboard-return
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: BACK
                                      - type: button
                                        name: Up
                                        icon: mdi:chevron-up
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: UP
                                      - type: button
                                        name: ""
                                        show_name: false
                                        show_icon: false
                                        tap_action:
                                          action: none
                                      - type: button
                                        name: Left
                                        icon: mdi:chevron-left
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: LEFT
                                      - type: button
                                        name: Enter
                                        icon: mdi:check-circle-outline
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: CENTER
                                      - type: button
                                        name: Right
                                        icon: mdi:chevron-right
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: RIGHT
                                      - type: button
                                        name: ""
                                        show_name: false
                                        show_icon: false
                                        tap_action:
                                          action: none
                                      - type: button
                                        name: Down
                                        icon: mdi:chevron-down
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: DOWN
                                      - type: button
                                        name: ""
                                        show_name: false
                                        show_icon: false
                                        tap_action:
                                          action: none
                                  - type: grid
                                    columns: 3
                                    square: false
                                    cards:
                                      - type: button
                                        name: Reverse
                                        icon: mdi:rewind
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: REWIND
                                      - type: button
                                        name: Play/Pause
                                        icon: mdi:play-pause
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: input keyevent KEYCODE_MEDIA_PLAY_PAUSE
                                      - type: button
                                        name: Forward
                                        icon: mdi:fast-forward
                                        tap_action:
                                          action: perform-action
                                          perform_action: remote.send_command
                                          target:
                                            entity_id: remote.living_room_fireTV
                                          data:
                                            command: FAST_FORWARD
                                      - type: button
                                        name: Mute
                                        icon: mdi:volume-mute
                                        tap_action:
                                          action: perform-action
                                          perform_action: script.livingroom_soundbar_mute
                                      - type: button
                                        name: Vol Down
                                        icon: mdi:volume-minus
                                        tap_action:
                                          action: perform-action
                                          perform_action: >-
                                            script.livingroom_soundbar_volume_down_burst
                                      - type: button
                                        name: Vol Up
                                        icon: mdi:volume-plus
                                        tap_action:
                                          action: perform-action
                                          perform_action: >-
                                            script.livingroom_soundbar_volume_up_burst
                                  - type: custom:nonlinear-timer-slider-card
                                    entity: >-
                                      input_number.livingroom_soundbar_mute_timer_seconds
                                    name: Mute Timer (seconds)
                                    icon: mdi:timer-sand
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Our Room
                    heading_style: subtitle
                    icon: mdi:bed-king
                  - type: tile
                    entity: light.our_room_our_room
                    name: Room Lights
                    icon: mdi:lightbulb-group
                    tap_action:
                      action: more-info
                    hold_action:
                      action: navigate
                      navigation_path: /home/areas-chases_room
                    features_position: bottom
                    features:
                      - type: light-brightness
                      - type: light-color-temp
                  - type: tile
                    entity: switch.our_room_box_fan_socket_1
                    name: Box Fan
                    icon: mdi:fan
                    tap_action:
                      action: toggle
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Guest Room
                    heading_style: subtitle
                    icon: mdi:bed
                  - type: tile
                    entity: light.guest_room_guest_room
                    name: Room Lights
                    icon: mdi:lightbulb-group
                    tap_action:
                      action: more-info
                    hold_action:
                      action: navigate
                      navigation_path: /home/areas-taylors_room
                    features_position: bottom
                    features:
                      - type: light-brightness
                      - type: light-color-temp
                  - type: tile
                    entity: switch.guest_room_fan_socket_1
                    name: Fan
                    icon: mdi:fan
                    tap_action:
                      action: toggle
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Kitchen
                    heading_style: subtitle
                    icon: mdi:countertop
                  - type: tile
                    entity: switch.kitchen_wax_melter_socket_1
                    name: Wax Melter
                    icon: mdi:candle
                    tap_action:
                      action: toggle
                  - type: tile
                    entity: switch.kitchen_wax_melter_socket_1
                    name: Room Control
                    icon: mdi:home-map-marker
                    hide_state: true
                    vertical: false
                    tap_action:
                      action: navigate
                      navigation_path: /home/areas-kitchen
                    hold_action:
                      action: navigate
                      navigation_path: /home/areas-kitchen
              - type: vertical-stack
                cards:
                  - type: heading
                    heading: Garage
                    heading_style: subtitle
                    icon: mdi:garage
                  - type: tile
                    entity: light.garage_garage
                    name: Garage Light
                    icon: mdi:garage
                    tap_action:
                      action: more-info
                    hold_action:
                      action: toggle
                  - type: tile
                    entity: light.garage_garage
                    name: Room Control
                    icon: mdi:home-map-marker
                    hide_state: true
                    vertical: false
                    tap_action:
                      action: navigate
                      navigation_path: /home/areas-garage
                    hold_action:
                      action: navigate
                      navigation_path: /home/areas-garage
            grid_options:
              columns: 12
              rows: auto
