livingroom_tv_select_input:
  alias: Living Room TV Select Input
  mode: single
  sequence:
    - variables:
        down_presses: "{{ down_presses | default(1) | int }}"

    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.livingroom_tv_state
              state: "off"
          sequence:
            - service: script.entertainment_system_on
            - delay:
                milliseconds: 5000

    - service: script.livingroom_tv_input

    - repeat:
        count: "{{ down_presses }}"
        sequence:
          - delay:
              milliseconds: 500
          - service: script.livingroom_tv_down

    - delay:
        milliseconds: 500
    - service: script.livingroom_tv_enter

livingroom_tv_hdmi_1:
  alias: Living Room TV HDMI 1
  mode: single
  sequence:
    - service: script.livingroom_tv_select_input
      data:
        down_presses: 1

livingroom_tv_hdmi_2:
  alias: Living Room TV HDMI 2
  mode: single
  sequence:
    - service: script.livingroom_tv_select_input
      data:
        down_presses: 2

entertainment_system_on:
  alias: Entertainment System On
  icon: mdi:television-play
  mode: single

  sequence:
    - service: script.livingroom_tv_set_on
    - delay:
        milliseconds: 400
    - service: script.livingroom_soundbar_set_on

    # Optional: select input after TV has had time to wake up.
    # Uncomment/adjust if you want this automatic.
    # - service: script.livingroom_tv_input

entertainment_system_off:
  alias: Entertainment System Off
  icon: mdi:television-off
  mode: single

  sequence:
    - service: script.livingroom_soundbar_set_off
    - delay:
        milliseconds: 400
    - service: script.livingroom_tv_set_off
