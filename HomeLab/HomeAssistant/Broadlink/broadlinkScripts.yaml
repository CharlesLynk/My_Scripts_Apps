plant_light_on:
  alias: Plant Light On
  sequence:
    - repeat:
        count: 5
        sequence:
          - service: remote.send_command
            target:
              entity_id: remote.broadlink
            data:
              device: Plant Light
              command: plant_light_on

          - delay:
              milliseconds: 200

    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.plant_light_state

  mode: single

plant_light_off:
  alias: Plant Light Off
  sequence:
    - repeat:
        count: 5
        sequence:
          - service: remote.send_command
            target:
              entity_id: remote.broadlink
            data:
              device: Plant Light
              command: plant_light_off

          - delay:
              milliseconds: 200

    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.plant_light_state

  mode: single

