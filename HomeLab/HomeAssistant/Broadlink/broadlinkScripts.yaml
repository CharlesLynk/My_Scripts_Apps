entertainment_system_on:
  alias: Entertainment System On
  icon: mdi:television-play
  mode: single

  sequence:
    - variables:
        tv_was_off: >
          {{ is_state('input_boolean.livingroom_tv_state', 'off') }}
        soundbar_was_off: >
          {{ is_state('input_boolean.livingroom_soundbar_state', 'off') }}

    # Turn TV on if helper says it is off.
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ tv_was_off }}"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.livingroom_tv_state

            - delay:
                milliseconds: 500

            - service: script.livingroom_tv_power

    # Turn soundbar on if helper says it is off.
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ soundbar_was_off }}"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.livingroom_soundbar_state

            - delay:
                milliseconds: 500

            - service: script.livingroom_soundbar_power

    # Only wait for TV boot if we actually powered the TV on.
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ tv_was_off }}"
          sequence:
            - delay:
                seconds: 1

    # Optional: select input after TV has had time to wake up.
    # Uncomment/adjust if you want this automatic.
    # - service: script.livingroom_tv_input

entertainment_system_off:
  alias: Entertainment System Off
  icon: mdi:television-off
  mode: single

  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.livingroom_soundbar_state
              state: "on"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.livingroom_soundbar_state

            - delay:
                milliseconds: 500

            - service: script.livingroom_soundbar_power

    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.livingroom_tv_state
              state: "on"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.livingroom_tv_state

            - delay:
                milliseconds: 500

            - service: script.livingroom_tv_power
